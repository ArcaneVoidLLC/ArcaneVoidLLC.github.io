<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcane Void</title>
<meta name="description" content="Arcane Void LLC builds small, careful software.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='30' fill='none' stroke='%23c9b8ff' stroke-width='7'/></svg>">
<meta property="og:title" content="Arcane Void">
<meta property="og:description" content="Small, careful software.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://arcanevoid.com/">
<meta property="og:image" content="https://arcanevoid.com/header.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://arcanevoid.com/header.png">
<link rel="apple-touch-icon" href="/icon.png">
<style>
  :root{--bg:#08070b; --ink:#e9e6f2; --muted:#7d7791; --accent:#c9b8ff; --line:#1a1723}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.7 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; display:flex; flex-direction:column;
    background-image:radial-gradient(90vw 60vh at 50% -12%, rgba(201,184,255,.10), transparent 60%);
    background-repeat:no-repeat;
  }
  main{
    flex:1 0 auto; width:min(680px,88vw); margin-inline:auto;
    display:flex; flex-direction:column; justify-content:center; padding:15vh 0 10vh;
  }
  .mark{display:block;margin-bottom:44px}
  @media (prefers-reduced-motion:no-preference){
    .mark{animation:drift 24s ease-in-out infinite}
    @keyframes drift{0%,100%{opacity:.85}50%{opacity:.45}}
  }
  h1{font-size:clamp(2.2rem,7vw,3.4rem);letter-spacing:-.035em;margin:0 0 24px;font-weight:600}
  p{color:var(--muted);margin:0 0 18px;max-width:48ch}
  .work{margin:56px 0 0;padding:30px 0 0;border-top:1px solid var(--line)}
  .work h2{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 18px;font-weight:600}
  .item{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:12px 0}
  .item a{color:var(--ink);text-decoration:none;font-size:1.05rem}
  .item a:hover{color:var(--accent)}
  .status{color:var(--muted);font-size:.84rem;align-self:center}
  footer{
    flex:none;width:min(680px,88vw);margin-inline:auto;padding:26px 0 44px;
    border-top:1px solid var(--line);font-size:.84rem;color:var(--muted);
  }
</style>
</head>
<body>

<main>
  <svg class="mark" width="40" height="40" viewBox="0 0 100 100" role="img" aria-label="Arcane Void">
    <circle cx="50" cy="50" r="30" fill="none" stroke="#c9b8ff" stroke-width="6"/>
    <circle cx="50" cy="50" r="7" fill="#c9b8ff"/>
  </svg>

  <h1>Arcane Void</h1>
  <p>A small software company. One thing is built at a time, and it is finished before the next one starts.</p>

  <div class="work">
    <h2>Work</h2>
    <div class="item">
      <a href="https://mysunlog.com">My Sun Log</a>
      <span class="status">In development</span>
    </div>
  </div>
</main>

<footer>Arcane Void LLC</footer>

</body>
</html>
